# Builds the release APK (unsigned: the signing key never leaves the owner's hands), runs the
# unit tests, and attaches the APK to a private *draft* Release named "CI build <sha>".
# Sign it afterwards with:  apksigner sign --ks sidepeek-release.jks app-release-unsigned.apk
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write   # create the draft Release that holds the APK

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: |
          mkdir -p out
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee out/test.log

      - name: Build release APK (unsigned)
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee out/build.log

      - name: Collect APK + signing tools
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/*.apk out/
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          cp "$BT/lib/apksigner.jar" out/apksigner.jar
          "$BT/zipalign" -c -p 4 out/*.apk && echo "zipalign OK"
          ls -la out

      - name: Upload to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT=${GITHUB_SHA::7}
          TAG="ci-$SHORT"
          # Drop older CI drafts (never touches published releases).
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft and (.tag_name | startswith("ci-"))) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true; done
          gh release create "$TAG" out/* --draft --target "$GITHUB_SHA" \
            --title "CI build $SHORT" \
            --notes "未簽名的建置（commit $GITHUB_SHA）。用正式金鑰簽名後才能安裝；這個草稿可以刪掉。"

      # Logs go to a draft Release too, so they can be read without access to the Actions UI.
      - name: Upload logs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=${GITHUB_SHA::7}
          TAG="ci-$SHORT-failed"
          mkdir -p out
          (cd app/build && zip -qr ../../out/reports.zip reports) 2>/dev/null || true
          for f in out/test.log out/build.log; do [ -f "$f" ] && tail -c 400000 "$f" > "$f.txt"; done
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" out/*.txt out/reports.zip --draft --target "$GITHUB_SHA" \
            --title "CI failed $SHORT" --notes "建置失敗的記錄，可以刪掉。" || true
