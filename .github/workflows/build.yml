# Builds the release APK, runs the unit tests, and attaches the APK to a private *draft* Release
# named "CI build <sha>".
# Signing: if these repository secrets exist, the APK is signed here and checked against the
# Sidepeek certificate fingerprint; otherwise an unsigned APK (plus apksigner.jar) is attached.
#   SIGNING_KEYSTORE_BASE64 (+ _2, _3)  base64 of sidepeek-release.jks, split into parts
#   SIGNING_STORE_PASSWORD   SIGNING_KEY_ALIAS   SIGNING_KEY_PASSWORD
# (Settings → Secrets and variables → Actions → New repository secret; the build log shows
#  only lengths / hashes of these values when something does not match)
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write   # create the draft Release that holds the APK

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: |
          mkdir -p out
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee out/test.log

      - name: Build release APK (unsigned)
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee out/build.log

      - name: Collect APK + signing tools
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/*.apk out/
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          cp "$BT/lib/apksigner.jar" out/apksigner.jar
          "$BT/zipalign" -c -p 4 out/*.apk && echo "zipalign OK"
          echo "BT=$BT" >> "$GITHUB_ENV"
          ls -la out

      - name: Sign APK (when signing secrets are set)
        env:
          # The keystore text is split into parts: phones cut long pastes at 2000 characters.
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}${{ secrets.SIGNING_KEYSTORE_BASE64_2 }}${{ secrets.SIGNING_KEYSTORE_BASE64_3 }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # Sidepeek's release certificate (CN=Line Preview). Signing with any other key fails.
          EXPECTED_CERT: da649b21b6f600f4d242ce377f17e61d9f315e938488079b25a6010f6f07909f
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ]; then echo "No signing secrets: leaving the APK unsigned."; exit 0; fi
          KS="$RUNNER_TEMP/release.jks"
          # Forgive stray spaces / line breaks picked up when pasting on a phone.
          KS_PASS=$(printf '%s' "$KS_PASS" | tr -d ' \r\n\t'); KEY_PASS=$(printf '%s' "$KEY_PASS" | tr -d ' \r\n\t')
          KS_B64=$(printf '%s' "$KS_B64" | tr -d ' \r\n\t')
          export KS_PASS KEY_PASS
          # Checks below print only lengths / hashes / yes-no, never the secret values.
          echo "::notice::keystore text: ${#KS_B64} chars (expected 5764); alias: ${#KEY_ALIAS} chars (expected 11)"
          echo "::notice::passwords: store ${#KS_PASS} chars, key ${#KEY_PASS} chars (expected 20 each)"
          if ! printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$KS" 2>/dev/null; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not valid base64 (cut off or extra text when pasting?)"; exit 1
          fi
          echo "::notice::keystore file: $(wc -c < "$KS") bytes, sha256 $(sha256sum "$KS" | cut -c1-16)… (expected 4322 bytes, df3fd5100422…)"
          KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n\t')
          if ! keytool -list -keystore "$KS" -storepass:env KS_PASS >/dev/null 2>&1; then
            echo "::error::Cannot open the keystore with SIGNING_STORE_PASSWORD (wrong password, or the keystore text is damaged)"; exit 1
          fi
          if ! keytool -list -keystore "$KS" -storepass:env KS_PASS -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Alias '$KEY_ALIAS' not found in the keystore (SIGNING_KEY_ALIAS should be linepreview)"; exit 1
          fi
          VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          OUT="out/sidepeek-$VN-build$VC.apk"
          if ! java -jar "$BT/lib/apksigner.jar" sign --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out "$OUT" out/app-release-unsigned.apk 2> "$RUNNER_TEMP/sign.err"; then
            echo "::error::apksigner failed: $(head -c 300 "$RUNNER_TEMP/sign.err" | tr '\n' ' ')"; exit 1
          fi
          rm -f "$KS" "$OUT.idsig"
          CERT=$(java -jar "$BT/lib/apksigner.jar" verify --print-certs "$OUT" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          if [ "$CERT" != "$EXPECTED_CERT" ]; then echo "::error::Signed with an unexpected certificate: $CERT"; exit 1; fi
          echo "::notice::Signed OK with the Sidepeek certificate -> $OUT"
          rm -f out/app-release-unsigned.apk out/apksigner.jar

      - name: Upload to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT=${GITHUB_SHA::7}
          TAG="ci-$SHORT"
          # Drop older CI drafts (never touches published releases).
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft and (.tag_name | startswith("ci-"))) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true; done
          gh release create "$TAG" out/* --draft --target "$GITHUB_SHA" \
            --title "CI build $SHORT" \
            --notes "自動建置（commit $GITHUB_SHA）。檔名是 sidepeek-…apk 的是已簽名版，可直接安裝；只有 app-release-unsigned.apk 的話表示還沒設定簽名用的 Secret。"

      # Logs go to a draft Release too, so they can be read without access to the Actions UI.
      - name: Upload logs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=${GITHUB_SHA::7}
          TAG="ci-$SHORT-failed"
          mkdir -p out
          (cd app/build && zip -qr ../../out/reports.zip reports) 2>/dev/null || true
          for f in out/test.log out/build.log; do [ -f "$f" ] && tail -c 400000 "$f" > "$f.txt"; done
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" out/*.txt out/reports.zip --draft --target "$GITHUB_SHA" \
            --title "CI failed $SHORT" --notes "建置失敗的記錄，可以刪掉。" || true
