<!doctype html>
<!--
  Play 商店主題圖片（Feature graphic，1024×500）。
  呈現兩個主要功能：①通知依聊天室整理（左手機：通知欄）②Peek 條＋側邊欄（右手機）。
  用 Chrome 無頭模式截圖產生四種語言的 PNG：node store/feature-graphic/render.js
  語言用網址 #zh-TW / #en / #ja / #ko 切換。畫面裡的名字、訊息都是假資料。
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: linear-gradient(120deg, #166534 0%, #16A34A 62%, #22C55E 100%);
    font-family: "Segoe UI", "Microsoft JhengHei UI", sans-serif;
    color: #fff; position: relative;
  }
  body[data-lang="zh-TW"] { font-family: "Segoe UI", "Microsoft JhengHei UI", "Microsoft JhengHei", sans-serif; }
  body[data-lang="ja"]    { font-family: "Segoe UI", "Yu Gothic UI", "Meiryo UI", sans-serif; }
  body[data-lang="ko"]    { font-family: "Segoe UI", "Malgun Gothic", sans-serif; }

  .glow { position: absolute; border-radius: 50%; background: rgba(255,255,255,.08); }
  .g1 { width: 560px; height: 560px; right: -140px; top: -200px; }
  .g2 { width: 300px; height: 300px; left: -90px; bottom: -160px; background: rgba(0,0,0,.08); }

  .left { position: absolute; left: 60px; top: 0; bottom: 0; width: 420px;
          display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 76px; height: 76px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.22)); }
  .name { font-size: 54px; font-weight: 700; letter-spacing: -.5px; }
  .feat { margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
  .feat div { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; line-height: 1.25; }
  .feat b { flex: none; width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #15803D;
            font-size: 19px; display: flex; align-items: center; justify-content: center; }
  .sub { margin-top: 20px; font-size: 17px; opacity: .88; }

  /* 手機共用 */
  .phone { position: absolute; top: 40px; width: 236px; height: 500px; border-radius: 36px;
           background: #0F172A; padding: 9px; box-sizing: border-box; box-shadow: 0 24px 48px rgba(0,0,0,.30); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 28px; overflow: hidden; }
  .badge { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); z-index: 2;
           width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #15803D;
           font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center;
           box-shadow: 0 4px 10px rgba(0,0,0,.2); }

  /* ① 通知欄 */
  .pA { left: 488px; transform: rotate(-4deg); }
  .pA .screen { background: #E2E8F0; }
  .bar { display: flex; justify-content: space-between; padding: 12px 18px 0; color: #334155; font-size: 12px; font-weight: 600; }
  .qs { display: flex; gap: 9px; padding: 12px 14px 10px; }
  .qs i { flex: 1; height: 30px; border-radius: 15px; background: rgba(51,65,85,.14); }
  .qs i:first-child { background: #16A34A; opacity: .85; }
  .card { margin: 0 9px 8px; background: #fff; border-radius: 16px; padding: 10px 11px; color: #0F172A; }
  .ch { display: flex; align-items: center; gap: 8px; }
  .ch .av { width: 26px; height: 26px; font-size: 12px; }
  .ct { font-size: 12.5px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tm { font-size: 10px; color: #94A3B8; }
  .ln { margin: 5px 0 0 34px; font-size: 11px; color: #475569; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ln s { text-decoration: none; color: #0F172A; font-weight: 700; margin-right: 4px; }

  /* ② Peek 條＋側邊欄 */
  .pB { left: 748px; transform: rotate(4deg); }
  .pB .screen { background: linear-gradient(170deg, #E0F2FE 0%, #F1F5F9 55%, #DCFCE7 100%); }
  .clock { position: absolute; left: 20px; top: 36px; color: #334155; font-size: 36px; font-weight: 300; }
  .apps { position: absolute; left: 18px; bottom: 30px; display: grid;
          grid-template-columns: repeat(4, 32px); gap: 13px 14px; }
  .apps i { width: 32px; height: 32px; border-radius: 10px; background: rgba(51,65,85,.16); display: block; }
  .panel { position: absolute; right: 0; top: 66px; width: 176px; bottom: 96px;
           background: rgba(255,255,255,.97); border-radius: 18px 0 0 18px;
           box-shadow: -8px 0 22px rgba(15,23,42,.18); padding: 13px 10px 0 12px; box-sizing: border-box; }
  .panel h4 { margin: 0 0 10px; color: #0F172A; font-size: 12.5px; font-weight: 700; }
  .row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; }
  .txt { min-width: 0; }
  .who { color: #0F172A; font-size: 11.5px; font-weight: 700; }
  .msg { color: #475569; font-size: 10.5px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 118px; }
  .peek { position: absolute; right: 180px; top: 178px; width: 6px; height: 70px; border-radius: 3px;
          background: #16A34A; box-shadow: 0 0 0 3px rgba(22,163,74,.18); }
  .hint { position: absolute; right: 193px; top: 199px; color: #16A34A; font-size: 21px; font-weight: 700; }

  .av { flex: none; width: 28px; height: 28px; border-radius: 50%; display: block; object-fit: cover; }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>

<div class="left">
  <div class="brand">
    <svg viewBox="0 0 108 108" aria-hidden="true">
      <rect width="108" height="108" rx="26" fill="#fff"/>
      <g transform="translate(54 54) scale(1.25) translate(-56 -54)">
        <path d="M40.67,34H60.67A12,12 0 0 1 72.67,46V55.33A12,12 0 0 1 60.67,67.33H40.67A12,12 0 0 1 28.67,55.33V46A12,12 0 0 1 40.67,34ZM35.33,63.33L46.00,66.00L34.67,74.00Z" fill="#16A34A"/>
        <path d="M39.67,44.67H57.67A2.33,2.33 0 0 1 60,47V47A2.33,2.33 0 0 1 57.67,49.33H39.67A2.33,2.33 0 0 1 37.33,47V47A2.33,2.33 0 0 1 39.67,44.67Z" fill="#fff"/>
        <path d="M39.67,53.33H51A2.33,2.33 0 0 1 53.33,55.67V55.67A2.33,2.33 0 0 1 51,58H39.67A2.33,2.33 0 0 1 37.33,55.67V55.67A2.33,2.33 0 0 1 39.67,53.33Z" fill="#BBF7D0"/>
        <path d="M81,38H81A3,3 0 0 1 84,41V65.67A3,3 0 0 1 81,68.67H81A3,3 0 0 1 78,65.67V41A3,3 0 0 1 81,38Z" fill="#86EFAC"/>
        <path d="M61.33,35.33A7.33,7.33 0 1 1 76.00,35.33A7.33,7.33 0 1 1 61.33,35.33Z" fill="#fff"/>
        <path d="M63.33,35.33A5.33,5.33 0 1 1 74.00,35.33A5.33,5.33 0 1 1 63.33,35.33Z" fill="#FACC15"/>
      </g>
    </svg>
    <div class="name">Sidepeek</div>
  </div>
  <div class="feat">
    <div><b>1</b><span id="f1"></span></div>
    <div><b>2</b><span id="f2"></span></div>
  </div>
  <div class="sub" id="sub"></div>
</div>

<!-- ① 通知依聊天室整理 -->
<div class="phone pA"><div class="badge">1</div><div class="screen">
  <div class="bar"><span>9:41</span><span>▾</span></div>
  <div class="qs"><i></i><i></i><i></i><i></i></div>
  <div id="cards"></div>
</div></div>

<!-- ② Peek 條＋側邊欄 -->
<div class="phone pB"><div class="badge">2</div><div class="screen">
  <div class="clock">9:41</div>
  <div class="apps"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="peek"></div><div class="hint">‹</div>
  <div class="panel"><h4 id="ph"></h4><div id="rows"></div></div>
</div></div>

<script>
const T = {
  "zh-TW": { f1: "通知依聊天室整理", f2: "從邊緣一滑看最近訊息", sub: "全部在手機上處理・不需註冊・沒有廣告", ph: "最近訊息", now: "現在",
    group: "專案", cards: [
      ["專案", [["Tom", "投影片好了"], ["Ann", "我來訂會議室"], ["Mia", "明天十點開會"]]],
      ["Ann", [["", "照片我傳到群組了"], ["", "你看一下"]]],
      ["Tom", [["", "晚上一起吃飯嗎？"]]]],
    rows: [["Tom", "晚上一起吃飯嗎？"], ["Ann", "照片我傳到群組了"], ["專案", "Mia：明天十點開會"], ["Mia", "收到，謝謝！"]] },
  "en": { f1: "Notifications sorted by chat", f2: "Swipe in from the edge", sub: "Runs on your phone · No sign-up · No ads", ph: "Recent", now: "now",
    cards: [
      ["Project", [["Tom", "Slides are ready"], ["Ann", "I'll book the room"], ["Mia", "Meeting at 10 tomorrow"]]],
      ["Ann", [["", "Photos are in the group"], ["", "Take a look"]]],
      ["Tom", [["", "Dinner tonight?"]]]],
    rows: [["Tom", "Dinner tonight?"], ["Ann", "Photos are in the group"], ["Project", "Mia: Meeting at 10"], ["Mia", "Got it, thanks!"]] },
  "ja": { f1: "通知をトークごとに整理", f2: "画面の端からスワイプで確認", sub: "処理はスマホの中だけ・登録不要・広告なし", ph: "最近のメッセージ", now: "今",
    cards: [
      ["プロジェクト", [["Tom", "スライドできたよ"], ["Ann", "会議室とっておくね"], ["Mia", "明日10時に会議"]]],
      ["Ann", [["", "グループに画像送ったよ"], ["", "見てみて"]]],
      ["Tom", [["", "今夜ご飯どう？"]]]],
    rows: [["Tom", "今夜ご飯どう？"], ["Ann", "グループに画像送ったよ"], ["プロジェクト", "Mia：明日10時に会議"], ["Mia", "了解、ありがとう！"]] },
  "ko": { f1: "알림을 채팅방별로 정리", f2: "가장자리에서 밀어 바로 확인", sub: "모든 처리는 휴대폰 안에서 · 가입 없음 · 광고 없음", ph: "최근 메시지", now: "지금",
    cards: [
      ["프로젝트", [["Tom", "슬라이드 다 했어"], ["Ann", "회의실은 내가 잡을게"], ["Mia", "내일 10시 회의"]]],
      ["Ann", [["", "사진 그룹에 올렸어"], ["", "한번 봐줘"]]],
      ["Tom", [["", "오늘 저녁 같이 먹을래?"]]]],
    rows: [["Tom", "오늘 저녁 같이 먹을래?"], ["Ann", "사진 그룹에 올렸어"], ["프로젝트", "Mia: 내일 10시 회의"], ["Mia", "알겠어, 고마워!"]] },
};
// 頭像原稿在 store/avatars/*.svg，測試版截圖示範資料（ScreenshotDemo.kt）用的是同一份；其他名字（群組）用 group.svg。
const AVATAR = { Tom: "tom", Ann: "ann", Mia: "mia" };
const lang = (location.hash.slice(1) || "zh-TW");
const d = T[lang] || T["zh-TW"];
document.documentElement.lang = lang;
document.body.dataset.lang = lang;
for (const k of ["f1", "f2", "sub", "ph"]) document.getElementById(k).textContent = d[k];

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const avatar = (name) => { const a = el("img", "av"); a.src = `../avatars/${AVATAR[name] || "group"}.svg`; a.alt = ""; return a; };

const cards = document.getElementById("cards");
for (const [title, lines] of d.cards) {
  const c = el("div", "card"), h = el("div", "ch");
  h.append(avatar(title), el("div", "ct", title), el("div", "tm", d.now));
  c.append(h);
  for (const [who, msg] of lines) {
    const l = el("div", "ln");
    if (who) l.append(el("s", null, who));
    l.append(document.createTextNode(msg));
    c.append(l);
  }
  cards.append(c);
}

const rows = document.getElementById("rows");
for (const [who, msg] of d.rows) {
  const r = el("div", "row"), t = el("div", "txt");
  t.append(el("div", "who", who), el("div", "msg", msg));
  r.append(avatar(who), t);
  rows.append(r);
}
</script>
</body>
</html>
