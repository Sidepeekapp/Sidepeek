<!doctype html>
<!--
  Play 商店主題圖片（Feature graphic，1024×500）。
  用 Chrome 無頭模式截圖產生四種語言的 PNG：node store/feature-graphic/render.js
  語言用網址 #zh-TW / #en / #ja / #ko 切換。畫面裡的名字、訊息都是假資料。
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: linear-gradient(120deg, #166534 0%, #16A34A 62%, #22C55E 100%);
    font-family: "Segoe UI", "Microsoft JhengHei UI", sans-serif;
    color: #fff; position: relative;
  }
  body[data-lang="zh-TW"] { font-family: "Segoe UI", "Microsoft JhengHei UI", "Microsoft JhengHei", sans-serif; }
  body[data-lang="ja"]    { font-family: "Segoe UI", "Yu Gothic UI", "Meiryo UI", sans-serif; }
  body[data-lang="ko"]    { font-family: "Segoe UI", "Malgun Gothic", sans-serif; }

  /* 背景的淡圓，增加層次 */
  .glow { position: absolute; border-radius: 50%; background: rgba(255,255,255,.08); }
  .g1 { width: 520px; height: 520px; right: -120px; top: -180px; }
  .g2 { width: 300px; height: 300px; left: -90px; bottom: -160px; background: rgba(0,0,0,.08); }

  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px;
          display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 84px; height: 84px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.22)); }
  .name { font-size: 58px; font-weight: 700; letter-spacing: -.5px; }
  .tag { margin-top: 26px; font-size: 31px; font-weight: 600; line-height: 1.35; }
  .tag span { display: block; }
  .sub { margin-top: 14px; font-size: 19px; opacity: .88; line-height: 1.4; }

  /* 手機 */
  .phone { position: absolute; left: 640px; top: 46px; width: 262px; height: 520px;
           border-radius: 38px; background: #0F172A; padding: 10px; box-sizing: border-box;
           box-shadow: 0 24px 48px rgba(0,0,0,.30); transform: rotate(4deg); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 29px; overflow: hidden;
            background: linear-gradient(170deg, #E0F2FE 0%, #F1F5F9 55%, #DCFCE7 100%); }
  .clock { position: absolute; left: 22px; top: 40px; color: #334155; font-size: 40px; font-weight: 300; }
  .apps { position: absolute; left: 20px; bottom: 34px; display: grid;
          grid-template-columns: repeat(4, 34px); gap: 14px 16px; }
  .apps i { width: 34px; height: 34px; border-radius: 10px; background: rgba(51,65,85,.16); display: block; }

  /* 側邊欄 */
  .panel { position: absolute; right: 0; top: 72px; width: 196px; bottom: 92px;
           background: rgba(255,255,255,.97); border-radius: 20px 0 0 20px;
           box-shadow: -8px 0 22px rgba(15,23,42,.18); padding: 14px 12px 0 14px; box-sizing: border-box; }
  .panel h4 { margin: 0 0 10px; color: #0F172A; font-size: 13px; font-weight: 700; }
  .row { display: flex; gap: 9px; align-items: flex-start; margin-bottom: 11px; }
  .av { flex: none; width: 30px; height: 30px; border-radius: 50%; color: #fff;
        font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .txt { min-width: 0; }
  .who { color: #0F172A; font-size: 12px; font-weight: 700; }
  .msg { color: #475569; font-size: 11px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 128px; }
  /* Peek 條 */
  .peek { position: absolute; right: 200px; top: 190px; width: 6px; height: 74px; border-radius: 3px;
          background: #16A34A; box-shadow: 0 0 0 3px rgba(22,163,74,.18); }
  .hint { position: absolute; right: 214px; top: 214px; color: #16A34A; font-size: 22px; font-weight: 700; }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>

<div class="left">
  <div class="brand">
    <svg viewBox="0 0 108 108" aria-hidden="true">
      <rect width="108" height="108" rx="26" fill="#fff"/>
      <g transform="translate(54 54) scale(1.25) translate(-56 -54)">
        <path d="M40.67,34H60.67A12,12 0 0 1 72.67,46V55.33A12,12 0 0 1 60.67,67.33H40.67A12,12 0 0 1 28.67,55.33V46A12,12 0 0 1 40.67,34ZM35.33,63.33L46.00,66.00L34.67,74.00Z" fill="#16A34A"/>
        <path d="M39.67,44.67H57.67A2.33,2.33 0 0 1 60,47V47A2.33,2.33 0 0 1 57.67,49.33H39.67A2.33,2.33 0 0 1 37.33,47V47A2.33,2.33 0 0 1 39.67,44.67Z" fill="#fff"/>
        <path d="M39.67,53.33H51A2.33,2.33 0 0 1 53.33,55.67V55.67A2.33,2.33 0 0 1 51,58H39.67A2.33,2.33 0 0 1 37.33,55.67V55.67A2.33,2.33 0 0 1 39.67,53.33Z" fill="#BBF7D0"/>
        <path d="M81,38H81A3,3 0 0 1 84,41V65.67A3,3 0 0 1 81,68.67H81A3,3 0 0 1 78,65.67V41A3,3 0 0 1 81,38Z" fill="#86EFAC"/>
        <path d="M61.33,35.33A7.33,7.33 0 1 1 76.00,35.33A7.33,7.33 0 1 1 61.33,35.33Z" fill="#fff"/>
        <path d="M63.33,35.33A5.33,5.33 0 1 1 74.00,35.33A5.33,5.33 0 1 1 63.33,35.33Z" fill="#FACC15"/>
      </g>
    </svg>
    <div class="name">Sidepeek</div>
  </div>
  <div class="tag"><span id="t1"></span><span id="t2"></span></div>
  <div class="sub" id="sub"></div>
</div>

<div class="phone"><div class="screen">
  <div class="clock">9:41</div>
  <div class="apps"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="peek"></div><div class="hint">‹</div>
  <div class="panel">
    <h4 id="ph"></h4>
    <div id="rows"></div>
  </div>
</div></div>

<script>
const T = {
  "zh-TW": { t1: "訊息依聊天室整理", t2: "從邊緣一滑就看到", sub: "全部在手機上處理・不需註冊・沒有廣告", ph: "最近訊息",
    rows: [["Tom", "晚上一起吃飯嗎？"], ["Ann", "照片我傳到群組了"], ["專案", "Mia：明天十點開會"], ["Mia", "收到，謝謝！"]] },
  "en": { t1: "Messages sorted by chat.", t2: "Swipe in from the edge.", sub: "Runs on your phone · No sign-up · No ads", ph: "Recent",
    rows: [["Tom", "Dinner tonight?"], ["Ann", "Photos are in the group"], ["Project", "Mia: Meeting at 10"], ["Mia", "Got it, thanks!"]] },
  "ja": { t1: "メッセージをトークごとに整理", t2: "画面の端からスワイプで確認", sub: "処理はスマホの中だけ・登録不要・広告なし", ph: "最近のメッセージ",
    rows: [["Tom", "今夜ご飯どう？"], ["Ann", "写真をグループに送ったよ"], ["プロジェクト", "Mia：明日10時に会議"], ["Mia", "了解、ありがとう！"]] },
  "ko": { t1: "메시지를 채팅방별로 정리", t2: "가장자리에서 밀어 바로 확인", sub: "모든 처리는 휴대폰 안에서 · 가입 없음 · 광고 없음", ph: "최근 메시지",
    rows: [["Tom", "오늘 저녁 같이 먹을래?"], ["Ann", "사진 그룹에 올렸어"], ["프로젝트", "Mia: 내일 10시 회의"], ["Mia", "알겠어, 고마워!"]] },
};
const COLORS = ["#2563EB", "#DB2777", "#7C3AED", "#EA580C"];
const lang = (location.hash.slice(1) || "zh-TW");
const d = T[lang] || T["zh-TW"];
document.documentElement.lang = lang;
document.body.dataset.lang = lang;
for (const k of ["t1", "t2", "sub", "ph"]) document.getElementById(k).textContent = d[k];
document.getElementById("rows").innerHTML = d.rows.map(([who, msg], i) =>
  `<div class="row"><div class="av" style="background:${COLORS[i]}">${who[0]}</div>` +
  `<div class="txt"><div class="who"></div><div class="msg"></div></div></div>`).join("");
document.querySelectorAll("#rows .row").forEach((r, i) => {
  r.querySelector(".who").textContent = d.rows[i][0];
  r.querySelector(".msg").textContent = d.rows[i][1];
});
</script>
</body>
</html>
